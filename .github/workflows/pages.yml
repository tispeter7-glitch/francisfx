name: Deploy to GitHub Pages (flexible token)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select deploy token
        run: |
          if [ -n "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "Using GH_PAGES_PAT secret for deploy";
            echo "DEPLOY_TOKEN=${{ secrets.GH_PAGES_PAT }}" >> $GITHUB_ENV;
          else
            echo "Using default GITHUB_TOKEN for deploy";
            echo "DEPLOY_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV;
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ env.DEPLOY_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          # keep history small
          commit_message: "Deploy site to gh-pages: ${{ github.sha }}"
